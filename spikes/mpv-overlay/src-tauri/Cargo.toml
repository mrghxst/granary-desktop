[package]
name = "granary-spike"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "granary-spike"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libmpv2-sys = "4.0.1"

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Devices_Display",
  "Win32_System_LibraryLoader",
  "Win32_System_Console",
]

[[bin]]
name = "granary-spike"
path = "src/main.rs"

[[bin]]
name = "hdr-roundtrip"
path = "src/bin/hdr_roundtrip.rs"

# Standalone: not part of the root Cargo workspace (own lockfile).
[workspace]
