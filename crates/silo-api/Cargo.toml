[package]
name = "granary-silo-api"
description = "Typed client for the Silo media server /api/v2 (Rust-side HTTP, ADR-0004)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
bytes = "1.12.1"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "json", "query", "system-proxy", "stream"] }
rustls = { version = "0.23", default-features = false }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rustls-platform-verifier = "0.7.1"
keyring-core = "1.0.1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
wiremock = "0.6.5"
rcgen = "0.14.10"
tokio-rustls = "0.26.6"

[lints]
workspace = true
