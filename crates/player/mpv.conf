# Granary bundled mpv defaults (ADR-0002 L2 (a)), tuned for OLED HDR desktop monitors with Windows HDR on.
# The host loads this file with include= right after its own copy of these options (options::desktop_baseline,
# kept equal by a unit test), so playback is unchanged if the file is missing.
#
# Order at start-up: these defaults -> settings-driven options -> %APPDATA%\Granary\mpv.conf (optional, yours)
# -> forced host options (wid, config=no, input/OSC/terminal off).
# Set by the host per title and monitor, so not here: video-sync for VRR/passthrough, video-sync-max-factor,
# display-fps-override, target-peak, and the Settings choices for tone mapping and audio, which override the values
# below (docs/research/windows-display-audio.md).
# Justifications and sources: docs/research/windows-display-audio.md "Recommended mpv.conf".

# libplacebo renderer: needed for the colourspace hint, Dolby Vision, HDR10+ and SDR reference-white tracking.
vo=gpu-next
# DXGI flip swapchain and HDR colourspace signalling on Windows.
gpu-api=d3d11
# Zero-copy hardware decoding; HDR and Dolby Vision metadata survive the mapper.
hwdec=d3d11va
# Flip model: required for windowed HDR and independent flip.
d3d11-flip=yes
# Stay composed or independent-flip; no exclusive fullscreen mode changes.
d3d11-exclusive-fs=no
# Tag the swapchain PQ/BT.2020 when Windows HDR is on, sRGB otherwise.
target-colorspace-hint=auto
# Tone-map to the measured panel, not blind passthrough.
target-colorspace-hint-mode=target
# SDR video at the Windows "SDR content brightness".
hdr-reference-white=auto
# Only engaged when the source peak exceeds the panel peak.
tone-mapping=auto
# Measure real scene peaks so in-range content is left untouched.
hdr-compute-peak=auto
# Dither to the lower of swapchain depth and panel bits per colour.
dither-depth=auto
# Removes banding in compressed gradients.
deband=yes
# Lock frames to vsync on fixed-refresh panels; the host switches to audio sync for VRR and passthrough.
video-sync=display-resample
# Keep the last frame at the end so the host decides what happens next (up next, back to details).
keep-open=yes
# The Windows speaker layout, with a stereo fallback.
audio-channels=auto-safe
# Network cache for streams from the server.
cache=yes
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=64MiB
