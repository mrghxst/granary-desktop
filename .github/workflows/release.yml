name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libmpv:
    # Only job besides `draft` with a write token: `contents: write` lets GITHUB_TOKEN read the private draft-release
    # libmpv mirror (ADR-0005). No third-party code (pnpm/cargo deps) runs here; the SHA-256-verified archive goes to
    # the build job through the actions cache (final review M1).
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: libmpv cache
        id: cache
        uses: actions/cache@v6
        with:
          path: vendor-bin/libmpv
          key: libmpv-${{ hashFiles('scripts/libmpv.pin.json') }}
      - name: Fetch libmpv (mirror first, SHA-256 verified)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-libmpv.ps1

  installer:
    # Builds and install-tests the installer with a read-only token and no credentials left in .git/config, so
    # dependency install scripts and crate build scripts cannot write to the repository.
    needs: libmpv
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: libmpv (from the libmpv job's cache)
        uses: actions/cache/restore@v6
        with:
          path: vendor-bin/libmpv
          key: libmpv-${{ hashFiles('scripts/libmpv.pin.json') }}
          fail-on-cache-miss: true

      - name: Build NSIS installer
        shell: pwsh
        run: ./scripts/release-build.ps1 -Install

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  draft:
    # Attaches the installer to a DRAFT release (never published automatically). No checkout, no build.
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist

      - name: Attach to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem dist/*-setup.exe, dist/*.sha256 | ForEach-Object FullName
          if ($files.Count -ne 2) { Write-Error "expected installer + .sha256, got: $files"; exit 1 }
          # Tag builds use the tag; manual runs use v<version>-dev (version from the installer name).
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else {
            $name = (Get-Item ($files | Where-Object { $_ -like '*.exe' })).Name
            if ($name -notmatch '_(\d+\.\d+\.\d+)_') { Write-Error "cannot read version from $name"; exit 1 }
            "v$($Matches[1])-dev"
          }
          $notes = "Draft build from $env:GITHUB_SHA (run $env:GITHUB_RUN_ID). Review before publishing (private repo)."
          $isDraft = gh release view $tag --json isDraft -q .isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "Granary $tag" --notes $notes @files
          } elseif ($isDraft -eq 'true') {
            gh release upload $tag --clobber @files
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Keep target and notes in step with the uploaded build (final review L1).
            gh release edit $tag --draft --target $env:GITHUB_SHA --notes $notes
          } else {
            # Never replace assets of a release the owner already published (rule 4: drafts only).
            Write-Error "release $tag is already published; refusing to modify it"
            exit 1
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
