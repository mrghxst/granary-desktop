name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libmpv:
    # Small job whose only work is fetching the pinned libmpv: `contents: write` lets GITHUB_TOKEN list the private
    # draft-release mirror (ADR-0005), so CI never depends on shinchiro still hosting the pin. No third-party code
    # (pnpm/cargo deps) runs with this token. The verified archive is handed over through the actions cache.
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: libmpv cache
        id: cache
        uses: actions/cache@v6
        with:
          path: vendor-bin/libmpv
          key: libmpv-${{ hashFiles('scripts/libmpv.pin.json') }}
      - name: Fetch libmpv (mirror first, SHA-256 verified)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-libmpv.ps1

  verify:
    # No installer here (private-repo minutes); release.yml builds it on tags.
    needs: libmpv
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Rust toolchain (rust-toolchain.toml)
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: libmpv (from the libmpv job's cache)
        uses: actions/cache/restore@v6
        with:
          path: vendor-bin/libmpv
          key: libmpv-${{ hashFiles('scripts/libmpv.pin.json') }}
          fail-on-cache-miss: true

      - name: Check libmpv (idempotent, SHA-256 marker)
        shell: pwsh
        run: ./scripts/fetch-libmpv.ps1

      - name: Verify (fmt, clippy, tests, typecheck, lint, prettier, vitest, build, secret scan)
        shell: pwsh
        run: ./scripts/verify.ps1 -Install -SkipFetch
