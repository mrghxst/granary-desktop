[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/player", "crates/display", "crates/silo-api"]
# Phase 2 spike is throwaway and has its own lockfile.
exclude = ["spikes"]

[workspace.package]
version = "0.4.6"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mrghxst/granary-desktop"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
libmpv2-sys = "4.0.1"
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# A panic ends the process (phase-7 review M4): the panic hook restores the display state and is always followed by
# process exit, so it never switches HDR off under a playback that a caught panic would otherwise let continue.
panic = "abort"
